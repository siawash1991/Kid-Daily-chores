    <!-- Google Fonts: Lalezar (Headings) and Vazirmatn (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      body {
        font-family: 'Vazirmatn', sans-serif;
        /* Prevent pull-to-refresh on mobile */
        overscroll-behavior-y: none;
        user-select: none;
      }
      h1, h2, h3, .font-display {
        font-family: 'Lalezar', cursive;
      }
      
      /* Custom Bubble Animation for Water */
      @keyframes rise {
        0% { bottom: -10px; transform: translateX(0); opacity: 0; }
        50% { opacity: 1; }
        100% { bottom: 100%; transform: translateX(-20px); opacity: 0; }
      }
      .bubble {
        position: absolute;
        width: 10px;
        height: 10px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        animation: rise 4s infinite ease-in;
      }
      .bubble:nth-child(1) { left: 10%; animation-duration: 3s; animation-delay: 0.5s; }
      .bubble:nth-child(2) { left: 30%; animation-duration: 5s; animation-delay: 1s; }
      .bubble:nth-child(3) { left: 70%; animation-duration: 3.5s; animation-delay: 2s; }
      .bubble:nth-child(4) { left: 90%; animation-duration: 4.5s; animation-delay: 0s; }
    </style>
